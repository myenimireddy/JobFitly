<!DOCTYPE html>
<html>
<head>
  <title>Mock Ashby Application</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 700px; margin: 50px auto; padding: 20px; }
    [data-field-path] { margin-bottom: 24px; padding: 16px; border: 1px solid #e5e7eb; border-radius: 8px; }
    .ashby-application-form-question-title { font-weight: 600; margin-bottom: 8px; color: #374151; }
    input, textarea { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
    button { background: #4f46e5; color: white; padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; }
    ._yesno_y2cw4 { display: flex; gap: 12px; margin-top: 8px; }
    ._option_y2cw4 { padding: 8px 16px; border: 1px solid #d1d5db; border-radius: 4px; background: white; cursor: pointer; }
    ._option_y2cw4[aria-pressed="true"] { background: #4f46e5; color: white; border-color: #4f46e5; }
  </style>
</head>
<body>
  <h1>Software Engineer Application - Ashby</h1>
  
  <form id="ashby-form">
    <!-- Text Input -->
    <div data-field-path="fullName">
      <div class="ashby-application-form-question-title">Full Name <span>*</span></div>
      <input type="text" placeholder="Enter your full name">
    </div>

    <!-- Email (id matches live Ashby `_systemfield_email`) -->
    <div data-field-path="email">
      <div class="ashby-application-form-question-title">Email <span>*</span></div>
      <input type="email" id="_systemfield_email" name="email" placeholder="you@example.com">
    </div>

    <!-- Phone -->
    <div data-field-path="phone">
      <div class="ashby-application-form-question-title">Phone</div>
      <input type="tel" id="_systemfield_phone" name="phone" placeholder="+1 555-000-0000">
    </div>

    <!-- Yes/No Buttons -->
    <div data-field-path="workAuthorization">
      <div class="ashby-application-form-question-title">Are you authorized to work in the US? <span>*</span></div>
      <div class="_yesno_y2cw4" data-testid="ks-custom-select">
        <button type="button" class="_option_y2cw4" data-value="Yes" aria-pressed="false">Yes</button>
        <button type="button" class="_option_y2cw4" data-value="No" aria-pressed="false">No</button>
      </div>
    </div>

    <!-- Textarea -->
    <div data-field-path="coverLetter" data-testid="ks-textarea">
      <div class="ashby-application-form-question-title">Cover Letter</div>
      <textarea rows="6" placeholder="Tell us about yourself..."></textarea>
    </div>

    <!-- Radio Options -->
    <div data-field-path="experienceLevel" data-testid="ks-radio">
      <div class="ashby-application-form-question-title">Experience Level <span>*</span></div>
      <fieldset>
        <label><input type="radio" name="exp" value="junior"> Junior (0-2 years)</label><br>
        <label><input type="radio" name="exp" value="mid"> Mid-level (2-5 years)</label><br>
        <label><input type="radio" name="exp" value="senior"> Senior (5+ years)</label>
      </fieldset>
    </div>

    <div data-field-path="source" data-testid="ks-select">
      <div class="ashby-application-form-question-title">How did you hear about us?</div>
      <select name="source">
        <option value="">Select...</option>
        <option>LinkedIn</option>
        <option>Referral</option>
        <option>Company Website</option>
      </select>
    </div>

    <div data-field-path="consent" data-testid="ks-checkbox">
      <div class="ashby-application-form-question-title">Consent</div>
      <label><input type="checkbox" name="consent" value="1"> I agree to the candidate privacy policy</label>
    </div>

    <div data-field-path="resume" data-testid="ks-file">
      <div class="ashby-application-form-question-title">Resume</div>
      <input type="file" name="resume" accept=".pdf,.doc,.docx" />
    </div>

    <button type="submit" id="submit-application">Submit Application</button>
  </form>

  <div id="test-results" style="margin-top: 30px; padding: 20px; background: #f9fafb; border-radius: 8px;">
    <h3>Ashby Portal Tests</h3>
    <div id="results">Running tests...</div>
  </div>

  <script>
    // Mirror live Ashby: clicking a Yes/No option sets aria-pressed.
    document.querySelectorAll('[data-field-path="workAuthorization"] button[data-value]').forEach((btn) => {
      btn.addEventListener('click', () => {
        btn.parentElement.querySelectorAll('button[data-value]').forEach((b) => {
          b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
        });
      });
    });

    window.AshbyTest = {
      results: [],
      log(msg, status = 'info') {
        this.results.push({ msg, status });
        document.getElementById('results').innerHTML = this.results.map(r =>
          `<div style="color: ${r.status==='success'?'green':r.status==='error'?'red':'black'}">
            ${r.status==='success'?'✓':r.status==='error'?'✗':'•'} ${r.msg}
          </div>`
        ).join('');
      },
      run() {
        const fields = document.querySelectorAll('[data-field-path]');
        this.log(`Found ${fields.length} Ashby fields`, fields.length > 0 ? 'success' : 'error');
      }
    };
    // Do not auto-run on load — pollutes UI e2e forms.
  </script>
</body>
</html>
