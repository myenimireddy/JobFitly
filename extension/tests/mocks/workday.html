<!DOCTYPE html>
<html>
<head>
  <title>Mock Workday Application - Capital One</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
    .form-field { margin-bottom: 20px; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 3px; }
    .saved-indicator { color: #10b981; font-size: 12px; margin-left: 8px; font-weight: 500; }
    button { background: #4ade80; color: white; padding: 12px 24px; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #22c55e; }
  </style>
</head>
<body>
  <h1>Job Application - Capital One</h1>
  <form id="application-form">
    
    <!-- Basic Info Section -->
    <div data-automation-id="formField-fullName">
      <label>Full Name <span class="required">*</span></label>
      <input type="text" id="fullName" placeholder="Enter your full name">
    </div>

    <div data-automation-id="formField-email">
      <label>Email <span class="required">*</span></label>
      <!-- id matches live Workday email control -->
      <input type="email" id="emailAddress--emailAddress" name="email" placeholder="Enter your email">
    </div>

    <div data-automation-id="formField-phone">
      <label>Phone Number</label>
      <input type="text" id="phone" placeholder="+1 (555) 000-0000">
    </div>

    <div data-automation-id="formField-linkedin">
      <label>LinkedIn URL</label>
      <input type="text" id="linkedin" placeholder="https://linkedin.com/in/...">
    </div>

    <!-- Live WD: listbox button inside formField; options mount in a document-level prompt panel -->
    <div data-automation-id="formField-country" data-testid="ks-custom-select">
      <label>Country <span class="required">*</span></label>
      <button type="button" id="country-listbox-btn" aria-haspopup="listbox" aria-expanded="false" data-prompt-key="country">Select Country</button>
    </div>

    <div data-automation-id="formField-address">
      <label>Address</label>
      <input type="text" id="address" placeholder="Street address">
    </div>

    <!-- Live WD: Address Line 1 is a text box with an address-search listbox button beside it. -->
    <div data-automation-id="formField-addressLine1" data-testid="ks-address-line-1">
      <label data-automation-id="formLabel">Address Line 1</label>
      <input type="text" id="address-line-1" placeholder="Address Line 1">
      <button type="button" aria-haspopup="listbox" aria-label="Search Address Line 1">Search</button>
    </div>

    <div data-automation-id="formField-state" data-testid="ks-custom-select-state">
      <label>State/Province</label>
      <button type="button" id="state-listbox-btn" aria-haspopup="listbox" aria-expanded="false" data-prompt-key="state">Select State</button>
    </div>

    <div data-automation-id="formField-sponsorship" data-testid="ks-checkbox">
      <label>Do you require sponsorship? <span class="required">*</span></label>
      <input type="checkbox" id="sponsorship"> Yes
    </div>

    <div data-automation-id="formField-salary">
      <label>Salary Expectations</label>
      <input type="text" id="salary" placeholder="e.g., 150000">
    </div>

    <div data-automation-id="formField-additionalInfo" data-testid="ks-textarea">
      <label>Additional Information</label>
      <textarea id="additionalInfo" rows="3" placeholder="Optional notes"></textarea>
    </div>

    <div data-automation-id="formField-hearAbout" data-testid="ks-select">
      <label>How did you hear about us?</label>
      <select id="hearAbout">
        <option value="">Select...</option>
        <option>LinkedIn</option>
        <option>Referral</option>
        <option>Company Website</option>
      </select>
    </div>

    <div data-automation-id="formField-workAuthRadio" data-testid="ks-radio">
      <label>Are you legally authorized to work in the United States?</label>
      <label><input type="radio" name="workAuthRadio" value="Yes"> Yes</label>
      <label><input type="radio" name="workAuthRadio" value="No"> No</label>
    </div>

    <div data-automation-id="formField-resume" data-testid="ks-file">
      <label>Resume</label>
      <input type="file" id="resume" accept=".pdf,.doc,.docx" />
    </div>

    <!-- Work Experience rows reuse the same automation-id (live Workday). -->
    <div data-automation-id="formField-jobTitle">
      <label data-automation-id="formLabel">Job Title</label>
      <input type="text" id="jobTitle0" value="">
    </div>
    <div data-automation-id="formField-company">
      <label data-automation-id="formLabel">Company</label>
      <input type="text" id="company0" value="">
    </div>
    <div data-automation-id="formField-jobTitle">
      <label data-automation-id="formLabel">Job Title</label>
      <input type="text" id="jobTitle1" value="">
    </div>
    <div data-automation-id="formField-company">
      <label data-automation-id="formLabel">Company</label>
      <input type="text" id="company1" value="">
    </div>

    <button type="button" id="continue-btn" data-testid="ks-continue" disabled title="Multi-step Continue deferred — see coverage sheet">Continue</button>
    <button type="submit" id="submit-btn">Submit Application</button>
  </form>

  <!-- Options live outside formField (same as live Workday responsiveMonikerPrompt). -->
  <div id="wd-prompt" data-automation-id="responsiveMonikerPrompt" hidden
       style="border:1px solid #ccc;margin:12px 0;padding:8px;background:#fff;max-width:400px;">
  </div>

  <div id="test-results" style="margin-top: 30px; padding: 20px; background: #f3f4f6; border-radius: 8px;">
    <h3>Test Results</h3>
    <div id="results-content">Waiting for tests...</div>
  </div>

  <script>
    const PROMPT_OPTIONS = {
      country: ['United States', 'Canada', 'United Kingdom', 'India'],
      state: ['California', 'Texas', 'New York'],
    };

    (function wireWorkdayPrompts() {
      const prompt = document.getElementById('wd-prompt');
      let activeBtn = null;

      function closePrompt() {
        prompt.hidden = true;
        prompt.innerHTML = '';
        if (activeBtn) activeBtn.setAttribute('aria-expanded', 'false');
        activeBtn = null;
      }

      function openPrompt(btn) {
        const key = btn.getAttribute('data-prompt-key');
        const opts = PROMPT_OPTIONS[key] || [];
        activeBtn = btn;
        btn.setAttribute('aria-expanded', 'true');
        prompt.innerHTML = '';
        opts.forEach((label) => {
          const el = document.createElement('div');
          el.setAttribute('data-automation-id', 'promptOption');
          el.setAttribute('role', 'option');
          el.textContent = label;
          el.style.cssText = 'padding:6px 8px;cursor:pointer;';
          el.addEventListener('click', () => {
            btn.textContent = label;
            closePrompt();
          });
          prompt.appendChild(el);
        });
        prompt.hidden = false;
      }

      document.querySelectorAll('button[aria-haspopup="listbox"][data-prompt-key]').forEach((btn) => {
        btn.addEventListener('click', () => {
          if (activeBtn === btn && !prompt.hidden) closePrompt();
          else openPrompt(btn);
        });
      });
    })();

    window.PortalTest = {
      results: [],
      log(message, status = 'info') {
        this.results.push({ message, status, time: Date.now() });
        this.updateDisplay();
        console.log(`[PortalTest] ${message}`);
      },
      updateDisplay() {
        const container = document.getElementById('results-content');
        container.innerHTML = this.results.map(r =>
          `<div style="color: ${r.status === 'error' ? 'red' : r.status === 'success' ? 'green' : 'black'}; margin: 4px 0;">
            ${r.status === 'success' ? '✓' : r.status === 'error' ? '✗' : '•'} ${r.message}
          </div>`
        ).join('');
      },
      async runTests() {
        this.log('Starting e2e tests...', 'info');
        const fields = document.querySelectorAll('[data-automation-id^="formField-"]');
        this.log(`Found ${fields.length} form fields`, fields.length > 0 ? 'success' : 'error');
        document.getElementById('submit-btn').addEventListener('click', (e) => {
          e.preventDefault();
          this.log('Form submission captured', 'success');
        });
        this.log('Fixture ready (no auto-fill)', 'success');
      }
    };
  </script>
</body>
</html>
